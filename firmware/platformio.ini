; ScenTTy firmware - PlatformIO config
; Board: Freenove ESP32-WROVER (camera unplugged). "esp32dev" works fine for it.
;
;   pio run -d firmware -t upload        real firmware (default env)
;   pio run -d firmware -t uploadfs      web app (firmware/data/) into flash
;   pio run -d firmware -e bench -t upload   the pump bench test

[platformio]
default_envs = scentty

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:scentty]
board_build.filesystem = littlefs
; 3 MB app + 896 KB filesystem, no over-the-air update slot (we flash over USB).
; The default layout left the firmware at 93% of its space.
board_build.partitions = huge_app.csv
lib_deps =
  esp32async/AsyncTCP @ ^3.5.0
  esp32async/ESPAsyncWebServer @ ^3.12.1
  bblanchon/ArduinoJson @ ^7.4.3

[env:bench]
build_src_filter = -<*> +<../bench/>
